<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plantilla 16</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans‑serif;
    }

    body {
      background-color: #5f6267;
      transform: scale(0.85);
      transform-origin: top left;
    }

    .barra-superior {
      background-color: #84d6d6;
      height: 30px;
      width: 100%;
    }

    .encabezado {
      background-color: #84d6d6;
      width: 100%;
      height: 30px;
      display: flex;
    }

    .barra-navegacion {
      display: flex;
      height: 30px;
      width: 300px;
      background-color: #e6e6e6;
      border-top-right-radius: 5px;
    }

    .logo {
      width: 50px;
      height: 30px;
      background-color: #ff8671;
    }

    .seccion-menu {
      flex: 1;
      height: 30px;
      background-color: #e6e6e6;
    }

    .menu-derecha {
      width: 70px;
      height: 30px;
      background-color: #e6e6e6;
    }

    .controles-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100%;
    }

    .control-nav {
      width: 14px;
      height: 14px;
      background-color: #b3b3b3;
      border-radius: 50%;
    }

    .contenedor-busqueda {
      background-color: #f2f2f2;
      padding: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #e0e0e0;
    }

    .barra-busqueda {
      width: 85%;
      height: 28px;
      background-color: #fff;
      margin: 0 auto;
      border: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="barra-superior"></div>

  <header class="encabezado">
    <div class="barra-navegacion">
      <div class="logo"></div>
      <div class="seccion-menu"></div>
      <div class="menu-derecha">
        <div class="controles-nav">
          <div class="control-nav"></div>
          <div class="control-nav"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="contenedor-busqueda">
    <div class="barra-busqueda"></div>
  </div>
</body>
</html>
