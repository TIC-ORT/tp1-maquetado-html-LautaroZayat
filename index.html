<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>interfaz de video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans‑serif;
    }

    body {
      background-color: #5f6267;
      transform: scale(0.85);
      transform-origin: top left;
    }

    .barra-superior {
      background-color: #84d6d6;
      height: 30px;
      width: 100%;
    }

    .encabezado {
      background-color: #84d6d6;
      width: 100%;
      height: 30px;
      display: flex;
    }

    .barra-navegacion {
      display: flex;
      height: 30px;
      width: 300px;
      background-color: #e6e6e6;
      border-top-right-radius: 5px;
    }

    .logo {
      width: 50px;
      height: 30px;
      background-color: #ff8671;
    }

    .seccion-menu {
      flex: 1;
      height: 30px;
      background-color: #e6e6e6;
    }

    .menu-derecha {
      width: 70px;
      height: 30px;
      background-color: #e6e6e6;
    }

    .controles-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100%;
    }

    .control-nav {
      width: 14px;
      height: 14px;
      background-color: #b3b3b3;
      border-radius: 50%;
    }

    .contenedor-busqueda {
      background-color: #f2f2f2;
      padding: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #e0e0e0;
    }

    .barra-busqueda {
      width: 85%;
      height: 28px;
      background-color: #fff;
      margin: 0 auto;
      border: 1px solid #e0e0e0;
    }

    .nav-principal {
      background-color: #3e4249;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .nav-izquierda {
      display: flex;
      gap: 20px;
    }

    .item-nav {
      width: 35px;
      height: 35px;
      background-color: #52555c;
    }

    .botones-derecha {
      display: flex;
      gap: 10px;
    }

    .boton-nav-grande {
      width: 120px;
      height: 25px;
      background-color: #fff;
      border-radius: 2px;
    }

    .seccion-busqueda {
      background-color: #52555c;
      padding: 20px;
      display: flex;
      justify-content: space-between;
    }

    .botones-seccion-busqueda {
      display: flex;
      gap: 20px;
    }

    .boton-busqueda {
      width: 100px;
      height: 10px;
      background-color: #fff;
      opacity: 0.7;
    }

    .input-busqueda {
      width: 70%;
      height: 30px;
      display: inline-block;
    }

    .busqueda-gris {
      width: 100%;
      height: 100%;
      background-color: #ccc;
    }

    .contenido {
      display: flex;
      padding: 20px;
      gap: 20px;
      background-color: #52555c;
    }

    .barra-lateral {
      width: 25%;
      background-color: #3e4249;
      padding: 20px;
    }

    .item-lateral {
      margin-bottom: 15px;
      height: 10px;
      background-color: #fff;
      opacity: 0.3;
    }

    .item-lateral-activo {
      height: 15px;
      margin: 20px 0;
      background-color: #ff8671;
      opacity: 1;
    }

    .contenido-principal {
      width: 65%;
    }

    .reproductor-video {
      width: 100%;
      aspect-ratio: 16/6;
      background-color: #ff8671;
      position: relative;
      margin-bottom: 20px;
    }

    .boton-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      border-top: 30px solid transparent;
      border-left: 50px solid #fff;
      border-bottom: 30px solid transparent;
    }

    .flechas-navegacion {
      position: absolute;
      width: 100%;
      top: 50%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      transform: translateY(-50%);
    }

    .flecha {
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
    }

    .flecha-izquierda {
      border-right: 30px solid #fff;
    }

    .flecha-derecha {
      border-left: 30px solid #fff;
    }

    .miniaturas {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .miniatura {
      width: 30%;
      aspect-ratio: 16/9;
      background-color: #3e4249;
    }

    .info-video {
      display: flex;
      justify-content: space-between;
    }

    .columna-info {
      width: 30%;
    }

    .fila-info {
      height: 8px;
      background-color: #999;
      margin-bottom: 10px;
      width: 90%;
    }

    .pie {
      background-color: #3e4249;
      padding: 30px 20px;
    }

    .columnas-pie {
      display: flex;
      justify-content: space-between;
    }

    .columna-pie {
      width: 30%;
    }

    .encabezado-pie {
      height: 10px;
      width: 60%;
      background-color: #777;
      margin-bottom: 20px;
    }

    .texto-pie {
      height: 6px;
      width: 80%;
      background-color: #666;
      margin-bottom: 10px;
    }

    .botones-pie {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
    }

    .boton-pie {
      width: 80px;
      height: 10px;
      background-color: #666;
    }
  </style>
</head>
<body>
  <div class="barra-superior"></div>

  <header class="encabezado">
    <div class="barra-navegacion">
      <div class="logo"></div>
      <div class="seccion-menu"></div>
      <div class="menu-derecha">
        <div class="controles-nav">
          <div class="control-nav"></div>
          <div class="control-nav"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="contenedor-busqueda">
    <div class="barra-busqueda"></div>
  </div>

  <div class="nav-principal">
    <div class="nav-izquierda">
      <div class="item-nav"></div>
      <div class="item-nav"></div>
      <div class="item-nav"></div>
      <div class="item-nav"></div>
    </div>
    <div class="botones-derecha">
      <div class="boton-nav-grande"></div>
      <div class="boton-nav-grande"></div>
    </div>
  </div>

  <div class="seccion-busqueda">
    <div class="botones-seccion-busqueda">
      <div class="boton-busqueda"></div>
      <div class="boton-busqueda"></div>
      <div class="boton-busqueda"></div>
      <div class="boton-busqueda"></div>
    </div>
    <div class="input-busqueda">
      <div class="busqueda-gris"></div>
    </div>
  </div>

  <div class="contenido">
    <div class="barra-lateral">
      <div class="item-lateral"></div>
      <div class="item-lateral"></div>
      <div class="item-lateral-activo"></div>
      <div class="item-lateral"></div>
      <div class="item-lateral"></div>
      <div class="item-lateral"></div>
      <div class="item-lateral"></div>
      <div class="item-lateral"></div>
      <div class="item-lateral"></div>
      <div class="item-lateral"></div>
    </div>

    <div class="contenido-principal">
      <div class="reproductor-video">
        <div class="boton-play"></div>
        <div class="flechas-navegacion">
          <div class="flecha flecha-izquierda"></div>
          <div class="flecha flecha-derecha"></div>
        </div>
      </div>

      <div class="miniaturas">
        <div class="miniatura"></div>
        <div class="miniatura"></div>
        <div class="miniatura"></div>
      </div>

      <div class="info-video">
        <div class="columna-info">
          <div class="fila-info"></div>
          <div class="fila-info"></div>
          <div class="fila-info"></div>
        </div>
        <div class="columna-info">
          <div class="fila-info"></div>
          <div class="fila-info"></div>
          <div class="fila-info"></div>
        </div>
        <div class="columna-info">
          <div class="fila-info"></div>
          <div class="fila-info"></div>
          <div class="fila-info"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="pie">
    <div class="columnas-pie">
      <div class="columna-pie">
        <div class="encabezado-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
      </div>
      <div class="columna-pie">
        <div class="encabezado-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
      </div>
      <div class="columna-pie">
        <div class="encabezado-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
        <div class="texto-pie"></div>
      </div>
    </div>
    <div class="botones-pie">
      <div class="boton-pie"></div>
      <div class="boton-pie"></div>
      <div class="boton-pie"></div>
      <div class="boton-pie"></div>
    </div>
  </div>
</body>
</html>
